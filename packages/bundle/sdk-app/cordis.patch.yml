# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

    # Workspace registry: the registry-global archive set behind
    # `session/archive` / `session/unarchive` and `session/list`'s `archived`
    # flag. Web layers mount this too, so both front ends share one archive
    # set. Not lazy on purpose: `session/list` reads the set on every call,
    # and the bootstrap is a header-only scan.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

- id: hmr
  disabled: true

# The packaged carrier supplies a default; DSH_PRIMARY_RUNTIME overrides it,
# including an empty-string opt-out. Each row can be patched independently.
- insert:
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME)"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '')"

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME) && !process.env.DSH_BUNDLED_OFFICE_CLI"
      config:
        assetRoot: !!js "process.env.DSH_BUNDLED_OFFICE_SKILLS ?? process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '', '..', 'office-skills')"
        cli: !!js "process.env.DSH_BUNDLED_OFFICE_CLI === '' ? false : process.env.DSH_BUNDLED_OFFICE_CLI"
        node: !!js "process.env.DSH_BUNDLED_OFFICE_NODE ?? process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '', 'dependencies', 'node', 'bin', process.platform === 'win32' ? 'node.exe' : 'node')"
# Lazy rows: import and activation defer to `EntryTree.wakeLazy()`. The SDK
# handshake (`initialize`) waits only for non-lazy entries, so these module
# graphs stay out of the startup import queue; the wake starts right after the
# handshake response and `session/prompt` joins it before the first turn, so
# every tool and service below is live before the first model request.
# Only rows no handshake-path plugin hard-injects belong here: a non-lazy
# fiber waiting on a lazy service would park in `loader.await()`'s inertia
# tasks and stall `initialize` itself.
- id: llm-pi-ai
  lazy: true

# Typert remote gateway and plugin inventory: not on any SDK request path.
- id: typert-gateway
  lazy: true

- id: plugin-package-inventory-deepseek
  lazy: true

# Telemetry export; a session without feedback never captures anyway.
- id: session-telemetry-otel
  lazy: true

# Full-text search backend (`openAt: never` keeps SQLite closed until asked).
- id: session-query-sqlite
  lazy: true

# Web tools and their providers (one dependency group).
- id: web
  lazy: true

- id: web-search-deepseek
  lazy: true

- id: web-fetch-http
  lazy: true

- id: tool-web
  lazy: true

# Subagent runtime, providers, and its tools (one dependency group).
- id: subagent
  lazy: true

- id: subagent-spawn-in-process
  lazy: true

- id: subagent-fork-in-process
  lazy: true

- id: tool-subagent-control
  lazy: true

- id: tool-subagent
  lazy: true

- id: tool-subagent-fork
  lazy: true

# Workflow runtime and tool.
- id: ptc-runtime
  lazy: true

- id: workflow-ptc
  lazy: true

- id: tool-workflow
  lazy: true

# Standalone tool rows: they register into the tool registry, which the first
# model request snapshots after the wake.
- id: tool-goal
  lazy: true

- id: tool-todo
  lazy: true
